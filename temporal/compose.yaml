# The Temporal service the workflow runs on: its own PostgreSQL, the server and
# the web UI. Adapted from Temporal's own PostgreSQL compose file
# (github.com/temporalio/samples-server, compose/docker-compose-postgres.yml).
# Ports are published on loopback only; PostgreSQL is not published at all.
# It lives from `make up` to `make down`, as the workers do: a container that fails comes back,
# and none starts again by itself when Docker does, at WSL's start.
name: orchestra-temporal

services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      # Injected, not written into the file: `.env` beside this compose file sets it, and the
      # default only serves a database this stack never publishes.
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: on-failure

  schema:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POSTGRES_SEEDS: postgresql
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - ./setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh", "schema"]

  temporal:
    image: temporalio/server:1.32.0
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/dynamicconfig.yaml
    volumes:
      - ./dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/dynamicconfig.yaml:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: on-failure

  namespace:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh", "namespace"]

  ui:
    image: temporalio/ui:2.54.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: orchestration
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure

volumes:
  postgres-data:
