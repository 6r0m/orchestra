# Extend the default rules. The exception matches one investigated compiled export, not whole files.
[extend]
useDefault = true

[[allowlists]]
description = """
The pinned xterm renderer and its native serialization addon share a compiled map-export initializer
that triggers generic-api-key. Both bundles are unmodified registry artifacts, with source and integrity
recorded in their VERSION files. This exact match is JavaScript export syntax, not a credential.
The renderer's historical location holds identical bytes. Only the named rule, exact export match and
specific bundle paths qualify together; real credentials in these files remain failures. The public
gate tests the same-path generic-key refusal and rejection of the export outside these paths.
"""
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
regexes = ['''^t\.FourKeyMap=t\.TwoKeyMap=void[ ]$''']
paths = [
    '''^app/interfaces/workbench/static/vendor/xterm/xterm\.js$''',
    '''^workbench/vendor/xterm/xterm\.js$''',
    '''^app/interfaces/workbench/static/vendor/xterm-serialize/addon-serialize\.js$''',
]
