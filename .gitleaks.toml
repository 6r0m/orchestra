# Gitleaks configuration for Orchestra. It extends the tool's own rules and narrows nothing about
# them; the only allowlist here is one path, for one investigated reason.
[extend]
useDefault = true

[[allowlists]]
description = """
The vendored xterm.js is minified upstream code, and one of its identifiers has enough entropy to
match the generic-api-key rule. It is not a credential: workbench/vendor/xterm/ is @xterm/xterm
5.5.0 exactly as published — xterm.js, xterm.css and LICENSE compare byte for byte against the
registry tarball, whose sha512 is recorded in VERSION beside them. The allowlist is that directory
and nothing else, so a real secret anywhere in this repository is still a failure.
"""
paths = ['''^workbench/vendor/xterm/''']
