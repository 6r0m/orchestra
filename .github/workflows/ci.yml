# The only thing a robot checks here is that nothing private reaches this repository.
# The suite is run by hand on both supported hosts — see AGENTS.md and tests/README.md —
# because it drives real processes, real worktrees and a PTY on each host.
name: public-safety

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-safety:
    # The same check `make public-check` runs by hand, so what is private has one list: nothing
    # tracked that must not be, a scanner shown to be working, and no secret in the files or the
    # history a push carries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the history a push carries, not only its head
      - name: The public check
        run: bash tools/public_check.sh
